<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Benchmark Upload Download</title>
  </head>
  <body>
    <h1>Upload Download</h1>
    <input id="upload" type="file" />
    <input id="upload-secondary" type="file" multiple />
    <a id="download" href="/download.txt" download="download.txt">Download file</a>
    <output id="upload-result"></output>
    <script>
      document.querySelector("#upload").addEventListener("change", (event) => {
        const file = event.target.files[0];
        document.querySelector("#upload-result").textContent = file ? file.name : "none";
      });
    </script>
  </body>
</html>
