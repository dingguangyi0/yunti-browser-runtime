<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Benchmark Tab Opener</title>
  </head>
  <body>
    <h1>Tab Opener</h1>
    <button id="open">Open child tab</button>
    <script>
      document.querySelector("#open").addEventListener("click", () => {
        window.open("/form-controls.html?opened=1", "_blank", "noopener");
      });
    </script>
  </body>
</html>
